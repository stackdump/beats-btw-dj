<!doctype html>
<!--
  Ground truth for the stage's solo visualizers (corona, sonar, petal), measured in a real canvas.

  The bodies of renderCorona, renderSonar and renderPetal below are stage.js @ beats-bitwrap-io
  095d030 (public/lib/ui/stage.js) with `session` / `toneEngine` replaced by arguments. The page draws
  fixed scenes on an 800 x 600 (CSS px) canvas over the stage background (#0a0a1a) and prints the
  RGB of the probe pixels as JSON into <pre id="out">. The literals in
  Tests/DJViewsTests/Scopes/Stage/StageSoloChromeReferenceTests.swift are this page's output.

  DEVICE PIXEL RATIO. stage.js sizes its canvas as `width = round(w * dpr)` and draws under
  `setTransform(dpr, 0, 0, dpr, 0, 0)` (sizeScopeCanvas), and a canvas `shadowBlur` is NOT scaled by
  the transform: its Gaussian is blur/2 DEVICE pixels, so on a Retina screen (dpr 2) a glow is half
  as wide in CSS points as on a 1x screen. The page therefore draws every scene at the ratio in the
  URL hash (`#dpr=1`, the default, or `#dpr=2`). A probe at CSS (x, y) reads the device pixel
  (x * dpr, y * dpr); the profiles below are runs of device pixels.

  Re-measure (dpr 1; use #dpr=2 for the 2x numbers):

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --no-sandbox --hide-scrollbars --window-size=800,600 --virtual-time-budget=3000 \
      --dump-dom "file://$PWD/scripts/stage-solo-chrome-reference.html#dpr=1" \
      | grep -o '<pre id="out">.*</pre>' | sed 's/<[^>]*>//g'

  Findings that shaped the Swift port: a zero-length line is not drawn at all (no dot, no glow);
  the petal's radial gradient is a TWO-circle gradient whose second circle is centred on the tip,
  so most of the petal is the end colour; the petal loop leaks the previous petal's shadow state
  into the next fill.
-->
<html><body style="margin:0;background:#000">
<canvas id="c"></canvas>
<pre id="out">pending</pre>
<script>
const DPR = +((location.hash.match(/dpr=(\d+)/) || [0, 1])[1]);
const canvas = document.getElementById('c');
const W = 800, H = 600;
canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);   // sizeScopeCanvas
const ctx = canvas.getContext('2d', { willReadFrequently: true });
function fresh() { ctx.setTransform(1,0,0,1,0,0); ctx.shadowColor='rgba(0,0,0,0)'; ctx.shadowBlur=0; ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.setTransform(DPR,0,0,DPR,0,0); }
// The device pixel at CSS (x, y).
function px(x, y) { const d = ctx.getImageData(x * DPR, y * DPR, 1, 1).data; return [d[0], d[1], d[2]]; }
// A run of `n` device pixels along +x or +y from CSS (x, y): one channel (0 r, 1 g, 2 b).
function runX(x, y, n, ch) { const d = ctx.getImageData(x * DPR, y * DPR, n, 1).data; return Array.from({length: n}, (_, i) => d[i * 4 + ch]); }
function runY(x, y, n, ch) { const d = ctx.getImageData(x * DPR, y * DPR, 1, n).data; return Array.from({length: n}, (_, i) => d[i * 4 + ch]); }
function channelHue(ch) {
    if (ch == null) return 200;
    const known = { 1: 50, 2: 220, 3: 200, 4: 280, 5: 320, 6: 180, 7: 140, 8: 30, 9: 100, 10: 0, 11: 12, 12: 24, 13: 35, 14: 350, 20: 50, 21: 60, 22: 40, 23: 30 };
    return known[ch] ?? ((ch * 47) % 360);
}
// ---- verbatim bodies of stage.js renderCorona / renderSonar / renderPetal (session/ toneEngine replaced by arguments)
function renderCorona(data, cx, cy, planetR) {
    const w = W, h = H;
    const inner = planetR || Math.min(w, h) * 0.08;
    const innerR = inner + 18;
    const maxLen = Math.min(w, h) * 0.32;
    const n = data.length;
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
        const db = Math.max(-100, Math.min(0, data[i]));
        const norm = (db + 100) / 100;
        const len = norm * maxLen;
        const angle = (i / n) * Math.PI * 2 - Math.PI / 2;
        const x0 = cx + Math.cos(angle) * innerR;
        const y0 = cy + Math.sin(angle) * innerR;
        const x1 = cx + Math.cos(angle) * (innerR + len);
        const y1 = cy + Math.sin(angle) * (innerR + len);
        const hue = 200 - norm * 160;
        ctx.strokeStyle = `hsla(${hue}, 90%, 60%, ${0.35 + norm * 0.55})`;
        ctx.lineWidth = 2 + norm * 3.5;
        ctx.shadowColor = `hsla(${hue}, 90%, 55%, 0.6)`;
        ctx.shadowBlur = 6 + norm * 10;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
    }
    ctx.restore();
}
function renderSonar(rings, now, cx, cy) {
    const w = W, h = H;
    const maxR = Math.hypot(w, h) * 0.55;
    ctx.save();
    for (const r of rings) {
        const t = (now - r.born) / r.life;
        const radius = t * maxR;
        const alpha = (1 - t) * 0.85;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `hsla(${r.hue}, 95%, 60%, ${alpha})`;
        ctx.lineWidth = 1 + (1 - t) * 4;
        ctx.shadowColor = `hsla(${r.hue}, 95%, 55%, ${alpha * 0.5})`;
        ctx.shadowBlur = 8;
        ctx.stroke();
    }
    ctx.restore();
}
function renderPetal(panels, energyOf, cx, cy) {
    const w = W, h = H;
    const baseR = Math.min(w, h) * 0.08;
    const maxR  = Math.min(w, h) * 0.42;
    ctx.save();
    panels.forEach((panel, i) => {
        const angle = (i / panels.length) * Math.PI * 2 - Math.PI / 2;
        const hue = channelHue(panel.ch);
        const raw = energyOf(panel);
        const energy = Math.sqrt(raw);
        const len = baseR + (maxR - baseR) * (0.18 + energy * 0.95);
        const halfWidth = (Math.PI / panels.length) * (0.45 + energy * 0.5);
        const tipX = cx + Math.cos(angle) * len;
        const tipY = cy + Math.sin(angle) * len;
        const leftAng = angle - halfWidth;
        const rightAng = angle + halfWidth;
        const ctrlR = (baseR + len) * 0.55;
        const lx = cx + Math.cos(leftAng) * ctrlR;
        const ly = cy + Math.sin(leftAng) * ctrlR;
        const rx = cx + Math.cos(rightAng) * ctrlR;
        const ry = cy + Math.sin(rightAng) * ctrlR;
        const grad = ctx.createRadialGradient(cx, cy, baseR * 0.5, tipX, tipY, len);
        grad.addColorStop(0, `hsla(${hue}, 80%, 55%, ${0.25 + energy * 0.55})`);
        grad.addColorStop(1, `hsla(${hue}, 95%, 65%, ${0.05 + energy * 0.25})`);
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.quadraticCurveTo(lx, ly, tipX, tipY);
        ctx.quadraticCurveTo(rx, ry, cx, cy);
        ctx.fill();
        ctx.strokeStyle = `hsla(${hue}, 95%, 70%, ${0.4 + energy * 0.5})`;
        ctx.lineWidth = 1 + energy * 2.5;
        ctx.shadowColor = `hsla(${hue}, 95%, 60%, ${energy * 0.6})`;
        ctx.shadowBlur = 4 + energy * 14;
        ctx.stroke();
    });
    ctx.restore();
}
const out = { dpr: DPR };
// 1. petal gradient: 4 petals, petal 1 (right) with raw 0.01, hue of channel 4
fresh();
renderPetal([{ch:4,e:0},{ch:4,e:0.01},{ch:4,e:0},{ch:4,e:0}], p => p.e, 400, 300);
out.petalGradient = Object.fromEntries([-10, 5, 10, 20, 30, 52, 94, 100, 110].map(s => ['s'+s, px(400+s, 300)]));
// 2. petal leak: red full-energy petal then blue resting petal
fresh();
renderPetal([{ch:10,e:1},{ch:2,e:0},{ch:2,e:0},{ch:2,e:0}], p => p.e, 400, 300);
out.petalLeak = { fillRight60: px(460,300), fillRight30: px(430, 300), fillRight100: px(500, 300), up100: px(400,200), tipUp: px(400, 300-278) };
// 3. petal heights: raws 0, .25, 1, .04 channels 10,5,2,3
fresh();
renderPetal([{ch:10,e:0},{ch:5,e:0.25},{ch:2,e:1},{ch:3,e:0.04}], p => p.e, 400, 300);
out.petalLengths = { up84: px(400, 300-84), right120: px(520,300), right181: px(400+181,300), down200: px(400, 500), down278: px(400, 300+278), left123: px(400-123,300), left60: px(340,300) };
// 4. corona: bins 0:-75, 32:-50, 64:-25, 96:0 (rest silent -> -Infinity), planet none, centre 400,300
fresh();
const data = new Float32Array(128).fill(-Infinity); data[0]=-75; data[32]=-50; data[64]=-25; data[96]=0;
renderCorona(data, 400, 300, 0);
out.corona = { bar32mid: px(400+66+48, 300), bar32mid_row299: px(400+66+48, 299), bar32off4: px(400+66+48, 304), bar32off8: px(400+66+48, 308), bar32off14: px(400+66+48, 314), bar32off30: px(400+66+48, 330),
  bar96mid: px(400-66-96,300), bar64mid: px(400, 300+66+72), bar0mid: px(400, 300-66-24),
  dot1_399_233: px(399,233), dot1_400_233: px(400,233), dot2: px(399,232), dot3: px(400,234), dotNear: px(399, 236), capIn: px(464,300), capOut: px(563,300),
  bar32_beyond_end_5: px(400+66+96+5, 300), bar32_beyond_end_12: px(400+66+96+12, 300) };
// 5. sonar: hue 200 ring born so t=0.5 -> radius 275
fresh();
renderSonar([{born: 0, hue: 200, life: 900}], 450, 400, 300);
out.sonar = { axis675: px(675,300), axis674: px(674,300), axis676: px(676,300), axis677: px(677,300), axis678: px(678,300), axis680: px(680,300), axis685: px(685,300), axis665: px(665,300), axis670: px(670,300), centre: px(400,300) };
out.coronaDots = { b2_406_234: px(406,234), b2_407_234: px(407,234), b2_406_235: px(406,235), b2_405_234: px(405,234), b2_406_233: px(406,233), b2_408_234: px(408,234), b2_406_236: px(406,236), b2_406_238: px(406,238) };

function countNonBg() { const d = ctx.getImageData(0,0,canvas.width,canvas.height).data; let n=0; for (let i=0;i<d.length;i+=4) { if (Math.abs(d[i]-10)+Math.abs(d[i+1]-10)+Math.abs(d[i+2]-26) > 2) n++; } return n; }
fresh(); renderCorona(new Float32Array(128).fill(-Infinity), 400, 300, 0); out.silentNonBg = countNonBg();
fresh(); renderCorona(new Float32Array(128).fill(-99.9999), 400, 300, 0); out.nearSilentNonBg = countNonBg();
fresh(); renderCorona(new Float32Array(128).fill(-100), 400, 300, 0); out.floorNonBg = countNonBg();
// Profiles: runs of device pixels through the glow of each shape. Corona: the green channel down
// from the middle of bin 32's bar (y 300 .. 330, x 514); sonar: the blue channel along the axis out
// from the ring's centre line (x 670 .. 700, y 300); petal: the red channel along a row through a
// full-energy red petal pointing up (x 400 .. 520, y 200).
fresh();
{ const d = new Float32Array(128).fill(-Infinity); d[0]=-75; d[32]=-50; d[64]=-25; d[96]=0; renderCorona(d, 400, 300, 0); }
out.coronaGreen = runY(514, 300, 30 * DPR, 1);
fresh(); renderSonar([{born: 0, hue: 200, life: 900}], 450, 400, 300);
out.sonarBlue = runX(670, 300, 30 * DPR, 2);
fresh(); renderPetal([{ch:10,e:1},{ch:2,e:0},{ch:2,e:0},{ch:2,e:0}], p => p.e, 400, 300);
out.petalRed = runX(400, 200, 120 * DPR, 0);
document.getElementById('out').textContent = JSON.stringify(out);
document.title = 'done';
</script></body></html>
